# 产品信息。官网只宣传已经对用户开放的能力（需求文档 2.2、FR08）：
# 某项能力在后台关闭或还没上线时，把对应开关改成 false，相关段落、FAQ 会自动隐藏。
name: 半拍

# 统一产品定义（GEO：首页、关于页、结构化数据与对外资料保持同一种说法）
definition: 半拍是一款用于线上寻找游戏搭子、查看队伍和进行语音开黑的产品，覆盖双影奇境、星露谷物语、泰拉瑞亚、怪物猎人等游戏场景。
shortDescription: 按游戏、平台和游玩节奏，找到愿意一起开黑的人。

capabilities:
  # 找队列表与发车（今晚页）
  teamList: true
  # 找玩伴：游戏名片、按游戏需求与游玩习惯推荐，并写明推荐理由
  companions: true
  # 帮我找队：写下条件，由系统按条件找队伍和玩家
  findAssistant: true
  # 队伍语音（App）
  teamVoice: true
  # 网页版语音（后台开关 web_voice）
  webVoice: true
  # 固定队
  squads: true
  # 约下一场、固定队周期约玩（后台开关 next_plans）
  nextPlans: true
  # 长期档：星露谷物语长期农场、泰拉瑞亚长期世界（后台开关 campaigns）
  campaigns: true
  # 开黑结束后评价队友
  feedback: true
  # 联机步骤与"加不进去"上报（后台开关 join_guide）
  joinGuide: true

# 与协议一致的最低使用年龄
minAge: 18

# 收费说明：来自当前商业化配置（基础功能不收费，"请半拍喝一杯可乐"为自愿支持项目）。不要写"永久免费""全部免费"。
pricingNote: 找队、找搭子和队伍语音等功能目前不需要付费。App 内可能提供自愿购买的支持项目（例如纪念徽章），是否购买不影响使用这些功能；价格与内容以购买页面的展示为准。
