h1: 找人一起开荒，|也一起把世界建起来
lead: 在泰拉瑞亚，一起开荒和一起建家是两种完全不同的玩法。开新世界、推进 Boss，或者一起慢慢建家：在玉米圈先把世界阶段、难度、装备约定和原版或模组说清楚，再进同一个世界。

