compatibility:
  officialFacts:
    - text: 怪物猎人 荒野支持 PS5、Xbox Series X|S 与 Steam 之间跨平台联机，在线最多 4 人。
      sourceName: CAPCOM 怪物猎人 荒野官网
      sourceUrl: https://www.monsterhunter.com/wilds/en-us/
    - text: 荒野的跨平台只能整体打开或关闭（在标题画面的选项 › 游戏设置中修改）；设置不同的玩家，即使在同一平台也不能一起玩。
      sourceName: CAPCOM 荒野常见问题
      sourceUrl: https://www.monsterhunter.com/support/wilds/en/faq/detail/023
    - text: 荒野联机不需要 CAPCOM ID；在 PS5 上在线游玩需要 PlayStation Plus。
      sourceName: CAPCOM 荒野常见问题
      sourceUrl: https://www.monsterhunter.com/support/wilds/en/faq/detail/036
    - text: 荒野需要先推进一段剧情才能解锁联机；部分内容有猎人等级门槛，例如大集会所需要 HR 16 以上。
      sourceName: CAPCOM 荒野系统介绍
      sourceUrl: https://www.monsterhunter.com/wilds/en-us/system/
    - text: 怪物猎人：世界的 PC 版只与 Steam 版玩家匹配，不支持跨平台联机；在线最多 4 人。
      sourceName: CAPCOM 怪物猎人：世界 PC 版介绍
      sourceUrl: https://www.monsterhunter.com/world/pc/us/
    - text: 冰原（大师级内容）需要拥有怪物猎人：世界本体。
      sourceName: CAPCOM 怪物猎人：世界 冰原官网
      sourceUrl: https://www.monsterhunter.com/world-iceborne/us/
    - text: 崛起：曙光的 PS4 与 PS5 版之间、Xbox 与 Windows（非 Steam）版之间可以互通；Switch 版与 Steam 版不支持跨平台联机。
      sourceName: CAPCOM 崛起：曙光多平台说明
      sourceUrl: https://www.monsterhunter.com/rise-xwp/en-us/
  checkedAt: 2026-10-19
  productNotes:
    - 怪物猎人 荒野、怪物猎人：世界已开放找队，两作分开匹配，不会被放进同一个队伍。
    - 可以按想打什么、目标怪物、HR / MR 最低要求和进度要求找队；你的游戏名片没填某项时，不会因此被排除。
    - 荒野按跨平台设置匹配：双方都填了跨平台设置、一个开一个关时，不会被放进同一个队伍（同平台也一样），与 CAPCOM 的官方说明一致；没填的一方不会因此被排除。
    - 怪物猎人：世界按平台分别找队。
    - 怪物猎人 崛起：曙光暂未开放找队。
  userChecks:
    - 双方是不是同一作、同一平台；玩荒野的话，填好跨平台设置，并确认双方一致（都开或都关）。
    - 是否已推进到能联机的剧情进度，任务的 HR / MR 要求是否满足。
    - 主机在线需要的会员（PlayStation Plus 等），以及队长填写的加入方式（集会所、邀请码等）。

faqs:
  - id: titles
    question: 不同作品能放在一起找队吗？
    answer: |
      不能。荒野和世界是两款游戏，玉米圈分开找队；两作之间不能互相联机，组队前请先确认大家玩的是同一作。

      同一作里也要分别核对平台：按 CAPCOM 官方说明，荒野的跨平台设置不同的人即使在同一平台也不能一起玩，世界的 PC 版只与 Steam 版玩家联机。玉米圈找队时也按这条规则处理：荒野跨平台设置一开一关的人不会被匹配到一起。
  - id: rank
    question: 怎样说明任务和等级？
    answer: |
      发车时选择想打什么和目标怪物，填写 HR / MR 最低要求和进度要求。你的游戏名片填了等级时，不满足要求的队伍会提示原因。

      任务能否进入以游戏内规则为准：例如荒野需要先推进一段剧情才能联机，部分内容有 HR 门槛。
  - id: rise
    question: 怪物猎人 崛起：曙光能找队吗？
    answer: |
      暂时还不能。崛起：曙光的找队还在准备中，开放后会更新这一页。

