# 素材与授权登记（需求文档 14.1 Asset、AC07）。src/assets 下的每个文件都必须在这里登记，
# 尺寸与实际文件一致、approvalState 为 approved，正式构建才会通过（scripts/check-dist.mjs 核对）。
# 产品截图由 scripts/capture-screens.mjs 从网页版本地演示模式截取，只含演示账号与演示数据，页面上标注"界面示意"。
# 游戏插画（src/components/art）为原创矢量图形，没有使用游戏官方素材、角色或标志。
assets:
  - path: brand/app-icon-source.png
    alt: ''
    width: 1024
    height: 1024
    rightsSource: 用户提供的半拍图标「水印-01.png」，由移动端统一生成 1024px 白底版本
    approvalState: approved
    demoDataOnly: true
  - path: brand/mark.png
    alt: ''
    width: 192
    height: 192
    rightsSource: 用户提供的半拍图标「水印-01.png」提取的圆形标识（scripts/make-icons.mjs 生成）
    approvalState: approved
    demoDataOnly: true

  - path: screens/team-list.png
    alt: 半拍找队页界面示意：按游戏查看正在招人的队伍，卡片上显示平台、开始时间、空位和推荐理由
    width: 1290
    height: 2634
    rightsSource: 自制：半拍网页版演示模式截图（演示数据）
    approvalState: approved
    demoDataOnly: true
  - path: screens/party-detail.png
