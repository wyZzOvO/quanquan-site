# 官网页面的安全响应头（需求文档 19.3）。只用于官网的 HTML location，/web/ 有自己的一组（需要麦克风）。
# 注意：location 里一旦写了 add_header，就不会再继承 server 级的 add_header，所以每个 HTML location 都 include 本文件。
# JSON-LD 是 <script type="application/ld+json"> 数据块，浏览器不执行，不需要为它放开内联脚本。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
# HSTS 只管 www 本域，不带 includeSubDomains，也不申请浏览器预加载列表（进去了很难撤回）：static 等子域各自决定。
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "microphone=(), camera=(), geolocation=(), payment=(), usb=()" always;
