# 半拍官网（半亩晴空）：由 deploy/install-nginx.sh 装成 /etc/nginx/snippets/quanquan-site.conf，
# include 在 www.monster-ovo.cn 的 443 server 里（与 quanquan-web.conf 并列）。
#
# 路由原则（需求文档 13.2、25.4）：官网只接管下面明确列出的路径；没有列出的路径继续走站点里原有的
# `location / { proxy_pass http://127.0.0.1:8075; }`，所以 /api/、/im、/s/、/r/、/t/、/creator、/legal/、
# /.well-known/ 和以后新增的后端路由都不受影响；/web/ 由 quanquan-web.conf 管。
# 不用"所有找不到的都回落到官网首页"这种写法，避免把接口吞成 HTML。
#
# 静态文件：/var/www/quanquan-site/current → releases/<版本>（deploy.sh 原子切换软链接，保留旧版本回滚）。

# 首页
location = / {
    root /var/www/quanquan-site/current;
    try_files /index.html =404;
    include /etc/nginx/snippets/quanquan-site-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# 带内容哈希的样式、脚本、图片：长期缓存（只给成功响应，不加 always，避免 404 被缓存一年）
location ^~ /_site/ {
    root /var/www/quanquan-site/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_vary on;
}

# 分享图：短缓存（图片会随页面更新而重新生成）
location ^~ /og/ {
    root /var/www/quanquan-site/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
}

# 目录型页面没有结尾斜杠时 301 到规范地址（/games/terraria → /games/terraria/），只跳一次
location ~ ^/(features|games|download|about|support)(/[a-z0-9-]+)?$ {
    return 301 $uri/$is_args$args;
}

# 官网的目录型页面：存在就 200，不存在返回真实 404（官网的 404 页面）
location ~ ^/(features|games|download|about|support)/ {
    root /var/www/quanquan-site/current;
    # 先找目录下的 index.html（/games/terraria/ → games/terraria/index.html），再找同名文件，都没有就是真实 404
    try_files ${uri}index.html $uri =404;
    error_page 404 /404.html;
    include /etc/nginx/snippets/quanquan-site-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# 根目录下的官网文件
location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|favicon\.ico|apple-touch-icon\.png|icon-192\.png|icon-512\.png)$ {
    root /var/www/quanquan-site/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    charset utf-8;
    charset_types text/plain application/xml;
}

# 404 页面只供内部使用，直接访问也返回 404 状态
location = /404.html {
    internal;
    root /var/www/quanquan-site/current;
    include /etc/nginx/snippets/quanquan-site-headers.conf;
    add_header Cache-Control "no-store" always;
}
